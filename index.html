<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>沁怡的互动个人网站</title>
    <style>
        /* ------------------- 基础样式 ------------------- */
        body {
            font-family: "微软雅黑", sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            scroll-behavior: smooth;
        }

        h1, h2 {
            color: #ff69b4;
        }

        /* ------------------- 导航栏 ------------------- */
        nav {
            background-color: #ff69b4;
            padding: 15px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffe4e1;
        }

        /* ------------------- 头部 ------------------- */
        header {
            text-align: center;
            padding: 60px 20px;
            background-color: #ffe4e1;
        }

        header h1 {
            font-size: 48px;
            margin: 0;
        }

        header p {
            font-size: 20px;
            margin-top: 10px;
            color: #ff1493;
        }

        /* ------------------- 内容区 ------------------- */
        section {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h2 {
            border-bottom: 2px solid #ffb6c1;
            padding-bottom: 5px;
            margin-bottom: 20px;
        }

        ul {
            padding-left: 20px;
        }

        ul li {
            margin-bottom: 8px;
        }

        img {
            max-width: 100%;
        }

        /* ------------------- 作品展示 ------------------- */
        .works {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .work-item {
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            background-color: #fff;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .work-item:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .work-item img {
            border-radius: 10px;
        }

        /* ------------------- 音乐 ------------------- */
        .music-controls {
            text-align: center;
            margin: 20px 0;
        }

        .music-controls button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .music-controls button:hover {
            background-color: #ff1493;
        }

        /* ------------------- 页脚 ------------------- */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #ff69b4;
            color: white;
            margin-top: 50px;
        }

        /* ------------------- 彩蛋弹窗 ------------------- */
        #easterEgg {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff0f5;
            border: 2px solid #ff69b4;
            padding: 30px;
            border-radius: 15px;
            z-index: 999;
            text-align: center;
            font-size: 20px;
            color: #ff1493;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        #easterEgg button {
            margin-top: 15px;
            padding: 5px 15px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #easterEgg button:hover {
            background-color: #ff1493;
        }
    </style>
</head>

    <nav>

    <!-- 头部 -->

    </header>

    <section id="about">

        <img src="mypicture.jpg" alt="我的照片" width="150" style="border-radius:50%; margin-top:10px;">
    </section>

    </section>

    <!-- 音乐播放 -->
    <section id="music">

    </section>

    <!-- 联系我 -->
    <section id="contact">
        <h2>联系我</h2>
        <p>Email: <a href="mailto:example@example.com">example@example.com</a></p>
    </section>

    <!-- 彩蛋弹窗 -->
    <div id="easterEgg">
        ✨ 你发现了彩蛋！愿你的每一天都充满灵性和快乐 ✨
        <br>
        <button onclick="document.getElementById('easterEgg').style.display='none'">关闭</button>
    </div>

    <!-- 页脚 -->
    <footer>
        &copy; 2026 沁怡的互动个人网站
    </footer>

        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({behavior: 'smooth'});
            });
        });

                alert(item.getAttribute('data-desc'));
            });
